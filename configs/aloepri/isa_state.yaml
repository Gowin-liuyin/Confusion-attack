name: aloepri_isa_state
mode: full
seed: 0
paper: {title: "AloePri", id: 2603.01499v2, section: "Appendix D.1 (ISA), Section 7.5, Table 4"}
attack:
  name: isa.aloepri_state
  variant: aloepri
  # AdamW optimizer (consistent with ISA Sec 5.1); L_im-only state matching.
  params: {distance: l2, steps: 50000, lr: 5.0e-4}
procedure:
  - "record State1 (hidden states) from the client's private input X1"
  - "randomly initialise X2 and evaluate State2"
  - "optimize X2 by the state loss L_im until State2 matches State1 (model weights fixed)"
targets:
  ablated_in_table4: [AttnScore, HiddenState]   # AloePri Table 4 / Sec 7.5 ISA targets
  implemented: [HiddenState]                     # this reproduction targets HiddenState only
  attnscore_status: >-
    NOT IMPLEMENTED. AloePri Table 4 also ablates ISA against attention scores
    (AttnScore), but the toy model exposes no attention map and the scenario
    plumbing only carries hidden states; AttnScore is not claimed here.
defense:
  mechanisms_ablated: [Noise, KeyMat, Head&BlockPerm]   # Table 4 / Sec 7.5
  privacy: {alpha_e: 1.0, alpha_h: 0.2, lambda: 0.3, expansion_h: 128, beta: 8, gamma: 1.0e-3}
models: [Qwen2.5-14B-Instruct]
metrics: {report: [ttrsr], ks: [1]}
hyperparameters:
  optimizer: AdamW            # consistent with ISA Sec 5.1; weight_decay UNSPECIFIED
  weight_decay: UNSPECIFIED
  loss: "L_im only (state matching); no L_dm (ER) and no SVD/arctan (TBS)"
  distance: MSE               # AloePri App D.1 does not specify; use the ISA default (MSE)
fidelity:
  approximations: {sampling: false, truncation: false, quantization: false, low_precision: false, pruning: false, early_stopping: false, candidate_truncation: false, approx_nearest_neighbor: false}
formula_refs: [ISA-1]
resource_requirement: "Requires the AloePri-obfuscated LLM with gradient access and ~5e4 steps per input; infeasible locally."
notes: >-
  This is the generic State1/State2 optimisation (L_im only) from AloePri
  Appendix D.1, optimised with AdamW. It does NOT claim to reproduce the original
  ER/TBS pipeline. It targets the decoder-layer HiddenState; the AttnScore target
  from Table 4 is honestly reported as NOT IMPLEMENTED rather than claimed.
