name: aloepri_nn
mode: full
seed: 0
paper: {title: "Towards Privacy-Preserving LLM Inference via Covariant Obfuscation (AloePri)", id: 2603.01499v2, section: "Section 7.2, Table 2 (NN baseline); metrics in Sec 7.1; embedding obfuscation Sec 5.2.2 / Alg 1"}
attack: {name: nn_knn.euclidean, variant: original, params: {top_k: 10}}
models: [Qwen2.5-14B-Instruct]
defense:
  method: AloePri covariant obfuscation
  generation: {temperature: 0.65, top_k: 20, top_p: 0.95, max_seq_len: 8192, dtype: bfloat16}
  privacy: {lambda: 0.3, expansion_h: 128, alpha_e: 1.0, alpha_h: 0.2, beta: 8, gamma: 1.0e-3}
dataset: {description: "private input texts; TTRSR / CosSim over recovered tokens"}
metrics:
  # AloePri Table 2 NN baseline reports TTRSR(%) and CosSim (cosine similarity of
  # the recovered vs. original text; lower is better for the defender).
  report: [ttrsr, cosine_similarity]
  # UNSPECIFIED by AloePri: its NN baseline reports NO Top-k accuracy. These ks
  # are borrowed from OSNIP App. C.1 (k in {1,5,10}) only so Top-k can be
  # reported if ever run; they are not an AloePri-stated setting.
  ks: [1, 5, 10]
assumptions:
  EXPERIMENTAL_COMPLETION: >-
    AloePri's obfuscated embedding table is W~_embed = Pi . W*_embed . P^_embed
    (Sec 5.2.2, paper line 488). The key matrix P^_embed is d x (d+2h): Algorithm 1
    KeyMatGen returns P^ = [B C E] Z with B in R^{d x d} and C, E in R^{d x h}
    (expansion size h = 128, paper lines 456/460-461). The obfuscated table thus
    has d+2h columns while the attacker's CLEAN reference table has only d, so a
    plain Euclidean nearest-neighbour lookup is NOT directly runnable (the
    observed and reference vectors live in different dimensions). Running NN
    against AloePri therefore needs an alignment / projection step (e.g. project
    the (d+2h)-dim obfuscated vectors into the d-dim clean space, or learn the
    alignment). That step is an engineering completion, NOT an AloePri-specified
    attack; AloePri Table 2 reports NN at ~0% TTRSR precisely because the
    attacker has no such alignment.
fidelity:
  approximations: {sampling: false, truncation: false, quantization: false, low_precision: false, pruning: false, early_stopping: false, candidate_truncation: false, approx_nearest_neighbor: false}
formula_refs: [NN-1, METRIC-TTRSR]
resource_requirement: "Requires Qwen2.5-14B-Instruct obfuscated with AloePri and GPU memory not available on the 8 GB local card. dtype bfloat16 is the DEFENSE's setting, not an attack-side approximation."
notes: >-
  NN direct geometric retrieval against AloePri-obfuscated embeddings. AloePri
  Table 2 (Sec 7.2) scores the NN baseline by TTRSR(%) and CosSim (~0% TTRSR,
  CosSim 0.42 for AloePri) and reports NO Top-k accuracy for NN; the ks here come
  from OSNIP. See `assumptions` for the d+2h dimensionality mismatch that makes a
  plain Euclidean lookup non-runnable (EXPERIMENTAL_COMPLETION). Kept as a
  separate AloePri-only file (no OSNIP dataset/params).
