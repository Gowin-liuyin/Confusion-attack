name: aloepri_sda
mode: full
seed: 0
paper: {title: "AloePri", id: 2603.01499v2, section: "Section 7.6, Appendix D.1 (SDA)"}
# AloePri CITES Aldarrab & May (2021) but its appendix DESCRIBES a recurrence
# encoding + Transformer causal LM, which matches Kambhatla et al. (2023). We
# therefore run the 2023 recurrence+CLM method for the AloePri adaptation
# (version "G2" = recurrence encoding + causal LM, both L_CLM terms) and record
# the citation/appendix version mismatch in docs/DEVIATIONS.md.
version_mix: G2                 # recurrence encoding + causal LM (= Kambhatla 2023), per the appendix
attack:
  name: sda.sda2023
  variant: original_2023
  # Scale follows the 2023 method (beam 200). AloePri does not restate SDA
  # training scale, so num_train/epochs mirror the 2023 config (resource_blocked).
  params: {epochs: 30, beam_width: 200, num_train: 1200000, homophonic: false}
version_note:
  cited: "Aldarrab & May 2021 (frequency-rank + encoder-decoder)"
  appendix_describes: "recurrence encoding + causal Transformer LM (Kambhatla et al. 2023)"
  chosen: "2023 recurrence+CLM (matches the appendix algorithm description) = version G2"
knowledge_settings: [zero_knowledge, domain_aware, distribution_aware]
dataset: {public: CCI3/MedDialog/Huatuo26M-Lite, private: Huatuo26M-Lite}
metrics: {report: [bleu4], ks: [1]}   # AloePri reports BLEU-4; computed in tests/regression/test_sda_regression.py
unspecified:
  # AloePri-silent SDA settings (it defers to the cited/appendix method).
  - num_train
  - epochs
  - model_dims
fidelity:
  approximations: {sampling: false, truncation: false, quantization: false, low_precision: false, pruning: false, early_stopping: false, candidate_truncation: false, approx_nearest_neighbor: false}
formula_refs: [SDA-2023-ENC, SDA-2023-OBJ]
resource_requirement: "resource_blocked. Requires the medical/public corpora and transformer training at paper scale (2023 recurrence+CLM method)."
notes: "AloePri reports BLEU-4 ~2 (insufficient to form meaningful text). Version mixing (cites 2021, runs 2023 G2) documented in DEVIATIONS.md."
