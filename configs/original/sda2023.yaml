name: original_sda2023
mode: full
seed: 0
paper:
  title: "Decipherment as Regression: Solving Historical Substitution Ciphers by Learning Symbol Recurrence Relations"
  authors: "Kambhatla et al., Findings of EACL 2023"
  id: 2023.findings-eacl.160
  section: "Recurrence encoding + causal LM, Eq. 1-2"
attack:
  name: sda.sda2023
  variant: original_2023
  params: {epochs: 20, beam_width: 100, num_train: 100000, homophonic: false}
cipher_types: ["1:1 substitution", "homophonic substitution"]
dataset:
  source: "Project Gutenberg (pgcorpus); public plaintext enciphered with random keys"
hyperparameters:
  encoding: recurrence            # first-appearance indices; NOT frequency rank
  model: "causal Transformer language model"
  objective: "L_CLM = -log P(X) - log P(Y|X)   (both terms)"
  decode: beam_search
metrics:
  report: [symbol_error_rate, decode_accuracy]
  ks: [1]
fidelity:
  approximations:
    sampling: false
    truncation: false
    quantization: false
    low_precision: false
    pruning: false
    early_stopping: false
    candidate_truncation: false
    approx_nearest_neighbor: false
formula_refs: [SDA-2023-ENC, SDA-2023-OBJ]
resource_requirement: >-
  Paper-scale training needs a large Gutenberg-derived corpus and beam width
  100. The recurrence encoding, the two-term CLM loss and homophonic ciphers are
  implemented and verified on a small synthetic language.
notes: >-
  The causal-LM loss keeps BOTH terms (-log P(X) and -log P(Y|X)); recurrence
  encoding (ABACAD -> 1 2 1 3 1 4) is distinct from frequency rank.
