name: osnip_knn
mode: full
seed: 42                       # OSNIP App. C: fixed random seed 42
paper:
  title: "OSNIP: Breaking the Privacy-Utility-Efficiency Trilemma in LLM Inference via Obfuscated Semantic Null Space"
  id: 2601.22752v1
  section: "Appendix C.1 (KNN Attack Setup), Section 4.3, Table 5"
attack:
  name: nn_knn.euclidean        # OSNIP ranks ALL vocabulary tokens by Euclidean (L2) distance only (App. C.1 / Sec 4.3)
  variant: original
  params: {top_k: 10}
models:                         # OSNIP evaluates four open-source LLMs
  - Llama-3.2-1B
  - Llama-3.2-3B-Instruct
  - Qwen3-14B
  - Qwen3-32B
dataset:
  source: tatsu-lab/alpaca
  construction: "concatenate the instruction and input fields"
  filter: "retain texts with 20-512 characters"
  sample: 1000                  # randomly sample 1,000 instances for testing
metrics:
  report: [top1_asr, top5_asr, top10_asr]
  ks: [1, 5, 10]
fidelity:
  approximations:               # attack-side approximations - all forbidden
    sampling: false
    truncation: false
    quantization: false
    low_precision: false
    pruning: false
    early_stopping: false
    candidate_truncation: false
    approx_nearest_neighbor: false   # full vocabulary ranking, exact NN
formula_refs: [NN-1, NN-2, METRIC-ASR]
resource_requirement: >-
  Requires the four target LLMs (up to Qwen3-32B) and their embedding/hidden
  states over 1,000 Alpaca samples. The 8 GB local GPU cannot host these models;
  full ranking over the entire vocabulary per token is exact but memory-heavy.
notes: >-
  Faithful transcription of OSNIP Appendix C.1. OSNIP's KNN attack uses
  Euclidean (L2) distance ONLY: App. C.1 / Sec 4.3 state the attacker "ranks all
  vocabulary tokens by Euclidean distance", and Appendix C.3 calls KNN the L2
  adversary. Cosine is not part of OSNIP, so no also_run cosine key is declared
  here (and the runner ignores any also_run key regardless). Not executed here
  (resource blocked); the KNN algorithm and metrics are verified on synthetic
  scenarios and math tests.
