name: osnip_vma
mode: full
seed: 42
paper:
  title: "OSNIP: Breaking the Privacy-Utility-Efficiency Trilemma ..."
  id: 2601.22752v1
  section: "Appendix C.2 (Vocabulary-Matching Attack Setup), Table 6"
attack:
  name: vma.osnip_projection    # project hidden states to vocab space, L1 match
  variant: osnip
  params: {top_k: 10, sorted_l1: false}
models:
  - Llama-3.2-1B
  - Llama-3.2-3B-Instruct
  - Qwen3-14B
  - Qwen3-32B
dataset:
  composite_sources:
    - {name: alpaca, source: tatsu-lab/alpaca, construction: "concat instruction + input"}
    - {name: arc, source: allenai/ai2_arc, subsets: [ARC-Challenge, ARC-Easy]}
    - {name: sciq, source: allenai/sciq, format: "Scientific Question + 4 options (1 correct + 3 distractors), options shuffled"}
    - {name: wikitext, source: wikitext-103-raw-v1, filter: "length > 50 chars", cap: 150000}
  pool_cap: 300000              # candidate pool capped at 300,000
  length_filter: "20-512 characters"
  test_set: 200                 # 200 distinct instances
  keys_per_instance: 5          # 5 independent perturbations -> 1,000 reps/model
  stop_words: "NLTK standard stopwords corpus (for Clean ASR)"
layers: [1, 5, 10, 15, 20, 30, 39]   # layer-wise analysis (Table 6)
metrics:
  distance: L1                  # the vocabulary-matching adversary uses L1
  report: [total_asr, clean_asr]
  ks: [1]
fidelity:
  approximations:
    sampling: false
    truncation: false
    quantization: false
    low_precision: false
    pruning: false
    early_stopping: false
    candidate_truncation: false        # the 300k pool is the paper's design, not a truncation we introduce
    approx_nearest_neighbor: false
formula_refs: [VMA-B3-1, METRIC-ASR, METRIC-TOTAL-CLEAN]
resource_requirement: >-
  Requires the four LLMs, a 300,000-entry candidate pool of per-token layer-l
  representations, and 1,000 perturbed reps per model across seven layers. Not
  feasible on the 8 GB local GPU.
notes: >-
  Faithful transcription of OSNIP Appendix C.2 (reuses Thomas et al. 2025 VMA in
  a hidden-state projection form). Resource blocked here; algorithm verified via
  synthetic scenarios + sorted-L1 math tests.
